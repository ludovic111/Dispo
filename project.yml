name: Dispo
options:
  bundleIdPrefix: com.ludovicmarie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Langue source du catalogue de traductions (Localizable.xcstrings).
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2YBQQ56HH8
    MARKETING_VERSION: "0.9.1"
    CURRENT_PROJECT_VERSION: "4"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
targets:
  Dispo:
    type: application
    platform: iOS
    sources:
      - Dispo
    dependencies:
      - package: Supabase
    # Sign in with Apple : capability refusée aux équipes personnelles
    # gratuites. Dès l'inscription au Developer Program (99 $/an),
    # décommenter ce bloc — le bouton Apple apparaîtra tout seul
    # (détection du profil embarqué à l'exécution).
    # entitlements:
    #   path: Dispo/Dispo.entitlements
    #   properties:
    #     com.apple.developer.applesignin: [Default]
    info:
      path: Dispo/Info.plist
      properties:
        CFBundleDisplayName: Dispo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: fr
        # Langues proposées dans l'app (sélecteur onboarding + profil).
        CFBundleLocalizations: [fr, en, es, de, it, zh-Hans, ja]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Dispo utilise votre position pour trouver des musiciens proches de vous."
        NSLocalNetworkUsageDescription: "Dispo se connecte au serveur de développement local sur votre réseau Wi-Fi."
        ITSAppUsesNonExemptEncryption: false
        # Autorise le backend Supabase local (http://<ip-du-mac>:54321) pendant
        # le développement. La prod (https) n'est pas concernée.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Lien magique de connexion : l'e-mail redirige vers dispo://login-callback.
        CFBundleURLTypes:
          - CFBundleURLName: ch.dispo.auth
            CFBundleURLSchemes: [dispo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.dispo.app
        PRODUCT_NAME: Dispo
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        GENERATE_INFOPLIST_FILE: false
