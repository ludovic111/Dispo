name: JamConnect
options:
  bundleIdPrefix: com.ludovicmarie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: YYJU63HSD4
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
targets:
  JamConnect:
    type: application
    platform: iOS
    sources:
      - JamConnect
    dependencies:
      - package: Supabase
    info:
      path: JamConnect/Info.plist
      properties:
        CFBundleDisplayName: JamConnect
        CFBundleShortVersionString: "0.3.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "JamConnect utilise votre position pour trouver des musiciens proches de vous."
        NSLocalNetworkUsageDescription: "JamConnect se connecte au serveur de développement local sur votre réseau Wi-Fi."
        ITSAppUsesNonExemptEncryption: false
        # Autorise le backend Supabase local (http://<ip-du-mac>:54321) pendant
        # le développement. La prod (https) n'est pas concernée.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ludovicmarie.jamconnect
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        GENERATE_INFOPLIST_FILE: false
