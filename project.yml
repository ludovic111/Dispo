name: Dispo
options:
  bundleIdPrefix: com.ludovicmarie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Langue source du catalogue de traductions (Localizable.xcstrings).
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2YBQQ56HH8
    MARKETING_VERSION: "2.4"
    CURRENT_PROJECT_VERSION: "31"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.0.0
schemes:
  Dispo:
    build:
      targets:
        Dispo: all
    run:
      config: Debug
      # Abonnements factices en simulateur (paywall testable hors App Store).
      # Ne concerne que le RUN local — l'archive Release n'embarque rien.
      storeKitConfiguration: Dispo/Products.storekit
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - DispoTests
        - DispoUITests
targets:
  Dispo:
    type: application
    platform: iOS
    sources:
      - path: Dispo
        excludes:
          # Config StoreKit locale (tests simulateur) — jamais dans le bundle.
          - "Products.storekit"
    dependencies:
      - package: Supabase
      - package: RevenueCat
    entitlements:
      path: Dispo/Dispo.entitlements
      properties:
        aps-environment: development
        # Sign in with Apple — nécessite la capability sur l'App ID
        # ch.dispo.app (portail Apple Developer) pour les builds signés.
        com.apple.developer.applesignin: [Default]
    info:
      path: Dispo/Info.plist
      properties:
        CFBundleDisplayName: Dispo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: fr
        # Langues proposées dans l'app (sélecteur onboarding + profil).
        CFBundleLocalizations: [fr, en, es, de, it, zh-Hans, ja]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Dispo utilise votre position pour trouver des musiciens proches de vous."
        NSLocalNetworkUsageDescription: "Dispo se connecte au serveur de développement local sur votre réseau Wi-Fi."
        ITSAppUsesNonExemptEncryption: false
        # Autorise le backend Supabase local (http://<ip-du-mac>:54321) pendant
        # le développement. La prod (https) n'est pas concernée.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Lien magique de connexion : l'e-mail redirige vers dispo://login-callback.
        CFBundleURLTypes:
          - CFBundleURLName: ch.dispo.auth
            CFBundleURLSchemes: [dispo]
        # iReal Pro : sans déclaration, `canOpenURL` répond toujours non et on
        # ne sait pas si l'app est installée (le bouton semblait alors mort).
        LSApplicationQueriesSchemes: [irealbook, irealb]
        # Polices de la DA « Coulisses & Laiton » (display + mono ticket).
        # Copiées à plat dans le bundle par Xcode (groupes, pas de dossier).
        UIAppFonts:
          - Fraunces-Display.ttf
          - Fraunces-DisplayItalic.ttf
          - SplineSansMono-Medium.ttf
          - SplineSansMono-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.dispo.app
        PRODUCT_NAME: Dispo
        TARGETED_DEVICE_FAMILY: "1"
        # Pas de UIUserInterfaceStyle forcé : il verrouillait UIKit en sombre
        # et le choix d'apparence des réglages ne s'appliquait pas en direct.
        GENERATE_INFOPLIST_FILE: false
  DispoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DispoTests
    dependencies:
      - target: Dispo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.dispo.app.tests
        GENERATE_INFOPLIST_FILE: true
  DispoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DispoUITests
    dependencies:
      - target: Dispo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.dispo.app.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Dispo
