plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ch.dispo.modules.documentpreview'
version = '1.0.0'

android {
  namespace 'ch.dispo.modules.documentpreview'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  lintOptions {
    abortOnError true
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.17.0'
}
